<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>더블제이디 현대백화점 천호점</title>
<meta name="description" content="더블제이디 현대백화점 천호점 — 인기 순위, 신상품, 코디">
<meta name="theme-color" content="#0d0d0f">
<link rel="icon" type="image/png" href="assets/favicon-sign.png">
<link rel="apple-touch-icon" href="assets/appicon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DBJD 천호">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script>
  // ▼ 앱스 스크립트 웹 앱 주소(…/exec)
  window.HP_API = 'https://script.google.com/macros/s/AKfycbwH2g-V2rRrxohamc6uhoH8fLHupxrtYLxBXwxEGZSoKaIvhSaUkoDzfL0l_wnnRK6S/exec';
</script>
<style>
  :root { --bg:#0d0d0f; --ink:#f2f2f3; --sub:#a9a9af; --mute:#7c7c83; --line:rgba(255,255,255,.09); --soft:#1a1a1d; --blue:#6cb4ff; --pink:#ff4d8d; --card:rgba(14,14,16,.93); --solid:#111113; --stroke:rgba(255,255,255,.16); --on:#0d0d0f; color-scheme:dark; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font-family:'Pretendard Variable', Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; -webkit-tap-highlight-color:transparent; letter-spacing:-0.01em; }
  body { min-height:100vh; }
  button, input, textarea { font-family:inherit; color:inherit; letter-spacing:inherit; }
  a { color:inherit; }
  .app { max-width:560px; margin:0 auto; min-height:100vh; position:relative; padding-bottom:56px; }
  .hs { scrollbar-width:none; } .hs::-webkit-scrollbar { display:none; }

  header.top { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:22px 20px 10px; }
  .brand { display:flex; flex-direction:column; gap:6px; text-decoration:none; }
  .brand img { height:19px; width:auto; display:block; }
  .brand span { font-size:12.5px; color:var(--sub); font-weight:400; }
  .brow { display:flex; align-items:center; gap:10px; }
  .brow a { display:block; }
  .admhome { border:0; background:none; padding:4px 0; font-size:14px; font-weight:700; color:var(--ink); cursor:pointer; white-space:nowrap; }
  .pill { display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:42px; padding:0 16px; border-radius:21px; border:1px solid #d6d6d6; background:#fff; font-size:14px; font-weight:500; cursor:pointer; text-decoration:none; white-space:nowrap; }
  .pill.dark { background:var(--ink); border-color:var(--ink); color:#fff; }
  .pill.blue { background:var(--blue); border-color:var(--blue); color:#fff; }
  .search { padding:8px 20px 0; }
  .search input { width:100%; height:46px; border:1px solid #d6d6d6; border-radius:23px; padding:0 20px; font-size:16px; background:#fff; outline:none; }
  .search input:focus { border-color:var(--ink); }
  .chips { display:flex; gap:8px; padding:14px 20px 4px; overflow-x:auto; }
  .chips .pill { flex:none; }
  .chips .pill.on { background:var(--ink); border-color:var(--ink); color:#fff; }
  .chips.sub { padding:6px 20px 2px; gap:6px; }
  .sb { flex:none; display:inline-flex; align-items:center; gap:6px; min-height:36px; padding:0 12px; border-radius:18px; border:1px solid var(--line); background:#fff; font-size:13px; font-weight:500; cursor:pointer; white-space:nowrap; }
  .sb i { width:7px; height:7px; border-radius:2px; background:var(--c, var(--ink)); }
  .sb.on { background:var(--c, var(--ink)); border-color:var(--c, var(--ink)); color:#fff; }
  .sb.on i { background:#fff; }

  .sec { display:flex; justify-content:space-between; align-items:flex-end; gap:10px; padding:30px 20px 12px; }
  .sec .lab { font-size:11px; font-weight:800; letter-spacing:.14em; color:var(--blue); margin-bottom:4px; }
  .sec .lab em { font-style:normal; color:var(--pink); margin-right:6px; }
  .gbg { position:absolute; inset:0; background:url(assets/graffiti.jpg) center 30%/cover no-repeat; opacity:.12; pointer-events:none; -webkit-mask-image:linear-gradient(#000 55%, transparent); mask-image:linear-gradient(#000 55%, transparent); }
  .topwrap { position:relative; }
  .topwrap header.top { position:relative; flex-direction:column; align-items:stretch; gap:14px; padding:20px 16px 16px; }
  .trow { display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .acts { display:flex; gap:6px; }
  .acts .pill { flex:1 1 0; min-width:0; padding:0 6px; gap:5px; background:rgba(255,255,255,.92); }
  .acts .pill.dark { background:var(--ink); }
  .inst { flex:none; display:inline-flex; align-items:center; gap:5px; min-height:32px; padding:0 11px; border-radius:16px; border:1px solid #d6d6d6; background:rgba(255,255,255,.92); font-size:12.5px; font-weight:600; cursor:pointer; color:var(--ink); }
  .inst[hidden] { display:none; }
  /* 흰 카드 묶음 */
  .box { background:#fff; border-radius:18px; margin:10px 10px 0; padding-bottom:18px; overflow:hidden; }
  .box :is(.sec, .row, .svl.home, .chips, .search, .rank, .grid, .morebox) { padding-left:16px; padding-right:16px; }
  .box :is(.row, .svl.home) { scroll-padding-inline:16px; }
  .box .sec { padding-top:20px; }
  .box .per { margin:10px 16px 0; }
  .box .empty { margin:6px 16px; }
  .box .sec + .chips.evt { padding-top:0; padding-bottom:14px; }
  .foot .visitcard { margin:10px 10px 0; background:#fff; border:0; }
  .foot .note { margin:18px 16px 0; }
  /* 옆으로 넘기는 줄: 끝 카드가 걸쳐 보이게 + 더 있으면 가장자리 흐리게 */
  .box .row .card { flex:0 0 calc((100% - 20px) / 2.4); }
  .box .row.evrow .evc { flex:0 0 calc((100% - 10px) / 1.6); }
  .box .svl.home .sv { flex:0 0 calc((100% - 20px) / 2.6); }
  @media (min-width:520px) { .box .row .card { flex-basis:calc((100% - 30px) / 3.4); } .box .row.evrow .evc { flex-basis:calc((100% - 20px) / 2.5); } .box .svl.home .sv { flex-basis:calc((100% - 40px) / 4.5); } }
  .hs.fr { -webkit-mask-image:linear-gradient(to right, #000 calc(100% - 56px), rgba(0,0,0,.25)); mask-image:linear-gradient(to right, #000 calc(100% - 56px), rgba(0,0,0,.25)); }
  .hs.fl { -webkit-mask-image:linear-gradient(to right, rgba(0,0,0,.25), #000 40px); mask-image:linear-gradient(to right, rgba(0,0,0,.25), #000 40px); }
  .hs.fl.fr { -webkit-mask-image:linear-gradient(to right, rgba(0,0,0,.25), #000 40px, #000 calc(100% - 56px), rgba(0,0,0,.25)); mask-image:linear-gradient(to right, rgba(0,0,0,.25), #000 40px, #000 calc(100% - 56px), rgba(0,0,0,.25)); }
  .box .row.igrow .igc { flex:0 0 calc((100% - 20px) / 2.4); }
  @media (min-width:520px) { .box .row.igrow .igc { flex-basis:calc((100% - 30px) / 3.4); } }
  .igc { min-width:0; display:flex; flex-direction:column; gap:6px; color:var(--ink); text-decoration:none; scroll-snap-align:start; }
  .igc .ip { position:relative; display:block; aspect-ratio:4/5; border-radius:10px; overflow:hidden; background:var(--soft); }
  .igc .ip img { width:100%; height:100%; object-fit:cover; display:block; }
  .igc .ic { position:absolute; right:7px; top:7px; width:24px; height:24px; border-radius:7px; background:linear-gradient(45deg,#f9a825,#e91e63 55%,#7b1fa2); display:flex; align-items:center; justify-content:center; }
  .igc b { font-size:13px; font-weight:600; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .igc small { font-size:11.5px; color:var(--mute); }
  .igadm { display:flex; gap:10px; align-items:center; padding:10px; border:1px solid var(--line); border-radius:12px; }
  .igadm .igp { position:relative; width:64px; height:80px; flex:none; border-radius:8px; overflow:hidden; background:#fafafa; border:1.5px dashed #c9c9c9; display:flex; align-items:center; justify-content:center; font-size:10.5px; line-height:1.35; color:#999; text-align:center; cursor:pointer; }
  .igadm .igp.has { border:0; }
  .igadm .igp img { width:100%; height:100%; object-fit:cover; display:block; }
  .igadm .igp.on { border-color:var(--blue); background:#eef5fb; }
  .igadm .igf { flex:1; min-width:0; display:flex; flex-direction:column; gap:6px; }
  .igadm .igf input { height:36px; font-size:13.5px; }
  .igadm .igx { display:flex; flex-direction:column; gap:2px; }
  .igadm .igx button { width:32px; height:28px; border:0; background:none; font-size:15px; color:#888; cursor:pointer; border-radius:6px; }
  .igadm .igx button:disabled { opacity:.25; }
  .igadm.act { border-color:var(--blue); }
  .evbox { position:relative; }
  .evc.ghost { visibility:hidden; }
  .evbox > .empty { position:absolute; left:0; right:0; top:0; }
  .guide { position:fixed; inset:0; z-index:80; background:rgba(0,0,0,.45); display:flex; align-items:flex-end; justify-content:center; }
  .guide > div { width:100%; max-width:560px; background:#fff; border-radius:18px 18px 0 0; padding:22px 20px calc(22px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:12px; }
  .guide b { font-size:17px; } .guide p { margin:0; font-size:14px; line-height:1.7; color:var(--sub); } .guide p strong { color:var(--ink); }
  .sec h2 { margin:0; font-size:19px; font-weight:700; white-space:nowrap; }
  .sec small { font-size:12.5px; color:var(--mute); font-weight:400; }
  .seg { display:inline-flex; border:1px solid #d6d6d6; border-radius:19px; overflow:hidden; }
  .seg button { border:0; background:#fff; min-height:36px; padding:0 13px; font-size:13px; font-weight:500; cursor:pointer; }
  .seg button.on { background:var(--ink); color:#fff; }

  .bd { flex:none; display:inline-flex; align-items:center; gap:4px; font-size:11.5px; font-weight:600; color:var(--c); background:color-mix(in srgb, var(--c) 9%, #fff); border:1px solid color-mix(in srgb, var(--c) 30%, #fff); border-radius:5px; padding:1px 6px; line-height:1.5; }
  .nl { display:flex; align-items:center; gap:6px; min-width:0; }
  .nl b { font-weight:600; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .nw { flex:none; font-size:10px; font-weight:700; letter-spacing:.06em; color:#fff; background:var(--pink); border-radius:4px; padding:1px 5px; }

  .rank { list-style:none; margin:0; padding:0 20px; display:flex; flex-direction:column; }
  .rr { width:100%; display:flex; align-items:center; gap:12px; padding:9px 0; border:0; border-bottom:1px solid var(--line); background:#fff; cursor:pointer; text-align:left; }
  .rank li:last-child .rr { border-bottom:0; }
  .rr .no { width:26px; flex:none; text-align:center; font-size:17px; font-weight:600; color:var(--mute); font-variant-numeric:tabular-nums; }
  .rr .no.top { color:var(--blue); font-weight:800; }
  .rr .th { width:52px; height:64px; flex:none; border-radius:8px; overflow:hidden; background:var(--soft); display:flex; align-items:center; justify-content:center; color:#aaa; }
  .rr .th img { width:100%; height:100%; object-fit:cover; display:block; }
  .rr .nl { flex:1; font-size:14.5px; }
  .rr .go { flex:none; color:#c4c4c4; }
  .morebox { display:flex; justify-content:center; padding:14px 20px 0; }
  .per { margin:10px 20px 0; font-size:11.5px; color:var(--mute); }

  .row { display:flex; gap:10px; padding:0 20px; overflow-x:auto; scroll-snap-type:x mandatory; scroll-padding-inline:20px; }
  .row .card { flex:0 0 148px; scroll-snap-align:start; }
  .grid { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:18px 10px; padding:0 20px; }
  .card { border:0; padding:0; background:none; text-align:left; cursor:pointer; display:flex; flex-direction:column; gap:8px; min-width:0; }
  .ph { position:relative; width:100%; aspect-ratio:3/4; border-radius:10px; overflow:hidden; background:var(--soft); display:flex; align-items:center; justify-content:center; color:#aaa; }
  .ph img { width:100%; height:100%; object-fit:cover; display:block; }
  .ph .nw { position:absolute; top:8px; left:8px; }
  .card .nl { font-size:13.5px; }
  img.ph0 { width:52% !important; height:auto !important; object-fit:contain !important; opacity:.22; }
  .sets { display:flex; flex-direction:column; gap:14px; padding:0 20px; }
  .set { border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .set .two { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); }
  .set .two button { border:0; padding:0; background:var(--soft); cursor:pointer; aspect-ratio:3/4; overflow:hidden; }
  .set .two img { width:100%; height:100%; object-fit:cover; display:block; }
  .set .cap { padding:12px 14px; display:flex; flex-direction:column; gap:2px; }
  .set .cap b { font-size:15px; font-weight:700; } .set .cap span { font-size:12.5px; color:var(--sub); }

  .note { margin:30px 20px 0; font-size:11.5px; color:var(--mute); line-height:1.7; }
  .empty { margin:6px 20px; padding:22px 18px; border:1px dashed #d9d9d9; border-radius:12px; font-size:13px; color:var(--sub); line-height:1.6; display:flex; align-items:center; gap:12px; }
  .empty img { width:46px; opacity:.6; flex:none; }
  .loading { padding:120px 20px; display:flex; flex-direction:column; align-items:center; gap:14px; color:var(--sub); font-size:13px; }
  .loading img { width:120px; animation:bob 1.4s ease-in-out infinite; }
  @keyframes bob { 50% { transform:translateY(-6px) rotate(-3deg); } }

  /* 상세 */
  .ov { position:fixed; inset:0; z-index:20; background:rgba(0,0,0,.4); display:flex; justify-content:center; align-items:flex-end; }
  .sheet { width:100%; max-width:560px; height:93vh; background:#fff; border-radius:18px 18px 0 0; overflow-y:auto; position:relative; }
  .shots { display:flex; overflow-x:auto; scroll-snap-type:x mandatory; background:var(--soft); }
  .shots .ph { flex:0 0 100%; border-radius:0; scroll-snap-align:start; aspect-ratio:4/5; }
  .shots .ph img { object-fit:contain; background:#fff; }
  .x { position:absolute; top:14px; right:14px; z-index:2; width:42px; height:42px; border-radius:21px; border:0; background:rgba(17,17,17,.82); color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .dots { display:flex; justify-content:center; gap:5px; padding:10px 0 0; }
  .dots i { width:6px; height:6px; border-radius:3px; background:#d4d4d4; } .dots i.on { background:var(--ink); width:16px; }
  .body { padding:18px 20px 44px; display:flex; flex-direction:column; gap:16px; }
  .meta { font-size:12px; color:var(--mute); }
  .title { display:flex; align-items:center; gap:8px; font-size:21px; font-weight:700; line-height:1.35; margin:4px 0 0; }
  .title .bd { font-size:12px; }
  .price { font-size:19px; font-weight:700; }
  .ranks { display:flex; gap:6px; flex-wrap:wrap; }
  .ranks span { font-size:12px; font-weight:600; color:var(--blue); background:color-mix(in srgb, var(--blue) 8%, #fff); border-radius:999px; padding:5px 11px; }
  .info { border-top:1px solid var(--line); margin:0; }
  .info div { display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); font-size:13.5px; line-height:1.6; }
  .info dt { width:76px; flex:none; color:var(--sub); margin:0; }
  .info dd { margin:0; font-weight:500; white-space:pre-line; min-width:0; }
  .colors { display:flex; flex-direction:column; gap:4px; }
  .colors span { color:var(--sub); font-weight:400; }
  .store { display:flex; flex-direction:column; gap:10px; }
  .store img { width:100%; display:block; border-radius:12px; border:1px solid var(--line); }
  .ask { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px; }
  .ask a { min-height:50px; font-size:14px; }
  .sub { font-size:16px; font-weight:700; margin:6px 0 -4px; }
  .mini { display:flex; gap:10px; overflow-x:auto; }
  .mini .card { flex:0 0 112px; }

  /* 코디 */
  .fit { position:fixed; inset:0; z-index:15; background:#fff; display:flex; justify-content:center; }
  .fitin { width:100%; max-width:560px; height:100%; display:flex; flex-direction:column; }
  .fith { height:56px; flex:none; display:flex; align-items:center; justify-content:space-between; padding:0 12px 0 6px; border-bottom:1px solid var(--line); }
  .fith b { font-size:16px; font-weight:700; }
  .ib { width:44px; height:44px; border:0; background:transparent; display:flex; align-items:center; justify-content:center; cursor:pointer; text-decoration:none; }
  .half { flex:1; min-height:0; position:relative; display:flex; background:#fff; }
  .half + .half { border-top:1px solid var(--line); }
  .hcol { flex:1; min-width:0; display:flex; flex-direction:column; }
  .stage { flex:1; min-height:0; position:relative; touch-action:pan-y; user-select:none; overflow:hidden; }
  .stage img.main { width:100%; height:100%; object-fit:contain; display:block; pointer-events:none; }
  .stage .nav { position:absolute; top:50%; margin-top:-21px; width:42px; height:42px; border-radius:21px; border:0; background:rgba(255,255,255,.92); box-shadow:0 1px 4px rgba(0,0,0,.12); cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .stage .nav.l { left:8px; } .stage .nav.r { right:8px; }
  .stage .rnd { position:absolute; top:8px; right:8px; height:34px; padding:0 11px; border-radius:17px; border:1px solid var(--line); background:rgba(255,255,255,.95); font-size:12.5px; font-weight:600; display:flex; align-items:center; gap:5px; cursor:pointer; }
  .stage.rolling img.main { filter:blur(3px); opacity:.5; transition:filter .2s, opacity .2s; }
  .roll { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; }
  .roll span { width:64px; height:64px; border-radius:16px; background:#fff; box-shadow:0 4px 18px rgba(0,0,0,.18); display:flex; align-items:center; justify-content:center; color:var(--blue); animation:dice .65s cubic-bezier(.3,.7,.4,1); }
  .roll svg { width:36px; height:36px; }
  @keyframes dice { 0% { transform:translateY(-30px) rotate(0) scale(.6); } 40% { transform:translateY(6px) rotate(300deg) scale(1.05); } 70% { transform:translateY(-6px) rotate(560deg); } 100% { transform:translateY(0) rotate(720deg) scale(1); } }
  .lbrow { flex:none; display:flex; align-items:center; gap:6px; padding:6px 8px 8px; }
  .lb { flex:1; min-width:0; display:flex; align-items:center; gap:8px; border:1px solid var(--line); background:#fff; border-radius:10px; padding:8px 10px; text-align:left; cursor:pointer; font-size:13.5px; }
  .lb small { flex:none; margin-left:auto; font-size:11.5px; color:var(--blue); font-weight:600; }
  .ask1 { flex:none; display:flex; align-items:center; gap:4px; min-height:38px; padding:0 11px; border-radius:10px; border:1px solid var(--line); font-size:12.5px; font-weight:600; text-decoration:none; color:var(--blue); }
  .pill.sm { min-height:36px; padding:0 13px; font-size:13px; }
  .recs { width:66px; flex:none; border-left:1px solid var(--line); display:flex; flex-direction:column; align-items:center; gap:6px; padding:8px 0; overflow-y:auto; background:#fafafa; }
  .recs small { font-size:10.5px; color:var(--sub); font-weight:600; text-align:center; line-height:1.3; }
  .recs button { width:52px; height:64px; flex:none; border:1px solid var(--line); border-radius:7px; overflow:hidden; padding:0; background:#fff; cursor:pointer; }
  .recs button.on { border:2px solid var(--blue); }
  .recs img { width:100%; height:100%; object-fit:cover; display:block; }
  .bar { flex:none; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 16px; border-top:1px solid var(--line); }
  .bar .pill { flex:1; }
  .bar span { font-size:13px; color:var(--sub); }
  .saved { flex:none; border-top:1px solid var(--line); padding:10px 16px 14px; }
  .saved .hd { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; min-height:30px; }
  .saved .hd b { font-size:13.5px; font-weight:700; }
  .saved .hd button { border:0; background:none; font-size:12.5px; color:var(--sub); cursor:pointer; padding:6px 2px; }
  .svl { display:flex; gap:8px; overflow-x:auto; scroll-snap-type:x proximity; }
  .sv { flex:0 0 calc((100% - 32px) / 5); scroll-snap-align:start; border:1px solid var(--line); border-radius:8px; overflow:hidden; padding:0; background:#fff; cursor:pointer; display:flex; flex-direction:column; }
  .sv.on { border:2px solid var(--blue); }
  .sv span { display:block; aspect-ratio:1/1; background:var(--soft); overflow:hidden; }
  .sv img { width:100%; height:100%; object-fit:cover; display:block; }
  .svl.home { padding:0 20px; scroll-padding-inline:20px; gap:10px; }
  .svl.home .sv { flex:0 0 132px; }
  .fit .svl, .svempty { height:calc((min(100vw, 560px) - 64px) / 5 * 2 + 4px); }

  @media (min-width:700px) {

  /* ===== 다크 테마 (전체 공통): 매장 사진 배경 + 검정 카드, 효과 최소 ===== */
  html { background:#0d0d0f; }
  html body { background:transparent; color:var(--ink); }
  body::before { content:''; position:fixed; inset:-40px; z-index:-1; background:url(assets/store-bg.jpg) center 35%/cover no-repeat; filter:blur(6px) brightness(.55) saturate(1.05); }

  .admhome { font-weight:600; }
  /* 버튼·입력 */
  .pill, .sb, .seg button, .inst, .tg, .opts button, .acts .pill { background:rgba(255,255,255,.04); border-color:var(--stroke); color:var(--ink); }
  .seg { border-color:var(--stroke); }
  .pill.dark, .acts .pill.dark, .chips .pill.on, .seg button.on, .opts button.on, .sb.on:not([style*="--c"]) { background:#f2f2f3; border-color:#f2f2f3; color:var(--on); }
  .sb.on[style*="--c"] { color:#fff; }
  .sb.on:not([style*="--c"]) i { background:var(--on); }
  .pill.blue, .tg.on { background:#2f7fd0; border-color:#2f7fd0; color:#fff; }
  .search input, .fld input, .fld textarea, .szgrid input { background:rgba(255,255,255,.04); border-color:var(--stroke); color:var(--ink); }
  .search input::placeholder, .fld input::placeholder, .fld textarea::placeholder, .szgrid input::placeholder { color:#6f6f76; }
  .search input:focus, .fld input:focus, .fld textarea:focus { border-color:rgba(255,255,255,.45); }
  .bd { color:color-mix(in srgb, var(--c) 50%, #fff); background:color-mix(in srgb, var(--c) 16%, transparent); border-color:color-mix(in srgb, var(--c) 40%, transparent); font-weight:500; }
  .ranks span { background:rgba(108,180,255,.12); }
  .askmain { background:rgba(108,180,255,.1); }
  .drop:focus, .drop.on { background:rgba(108,180,255,.08); }
  /* 표면 */
  .rr, .card, .evc, .igc, .visitcard { background:transparent; color:var(--ink); }
  .sv, .recs button, .pick button, .lb { background:var(--soft); border-color:var(--line); color:var(--ink); }
  .ph, .shots, .shots .ph img, .evc .ei, .igc .ip { background:var(--soft); }

  .empty img, .loading img { filter:invert(1); opacity:.55; }

  .roll span { background:#1c1c1f; box-shadow:none; }
  .sheet { background:var(--solid); }

  .fit { background:var(--solid); }
  .half { background:transparent; }

  .zoom { background:var(--solid); box-shadow:0 10px 30px rgba(0,0,0,.5); }
  .guide > div { background:var(--solid); }

</style>

<body>
<div class="app" id="app"><div class="loading"><img src="assets/bear-cap.png" alt=""><span>최신 상품 정보를 불러오는 중…</span></div></div>
<div id="layer"></div>

<script>
(function () {
  'use strict';
  var API = window.HP_API;
  var STORE = { tel: '02-2225-8934', sms: '010-4896-8934' };
  var ITEM_GROUP = { '40':'아우터','41':'아우터','52':'아우터','54':'아우터','60':'아우터','61':'아우터','62':'아우터','63':'아우터',
    '80':'하의','81':'하의','55':'하의', '75':'ACC','76':'ACC','77':'ACC','78':'ACC','79':'ACC','90':'ACC','95':'ACC' };
  var CATS = ['전체','아우터','상의','하의','ACC'];
  var NEW_DAYS = 14;
  var D = null, byCode = {};
  var st = { cat:'전체', sub:'', q:'', best:'own', more:false, ev:'popup', fitT:0, fitB:0 };

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); }
  function won(n) { return n ? Number(n).toLocaleString('ko-KR') + '원' : ''; }
  function group(p) { var k = p.c.substr(4,2), g = ITEM_GROUP[k]; if (g) return g; return (k === '25' || k === '99') ? '기타' : '상의'; }
  function isTop(p) { var g = group(p); return g === '상의' || g === '아우터'; }
  function isBot(p) { return group(p) === '하의'; }
  function skey(c) { var y = c.charCodeAt(1) - 70 + 2024, m = '123456789ABC'.indexOf(c.charAt(6)) + 1; return y * 100 + Math.max(0, m); }
  function name(p) { return p.nm || p.it || p.c; }
  function img(id, w) { return id ? 'https://lh3.googleusercontent.com/d/' + id + '=w' + (w || 600) : ''; }
  function imgTag(id, w, alt, cls) {
    if (!id) return '<img class="ph0" src="assets/bear-line.png" alt="">';
    return '<img' + (cls ? ' class="' + cls + '"' : '') + ' loading="lazy" alt="' + esc(alt || '') + '" src="' + img(id, w) + '" data-id="' + esc(id) + '" data-w="' + (w || 600) + '">';
  }
  document.addEventListener('error', function (e) {
    var t = e.target;
    if (t.tagName === 'IMG' && t.dataset.id && !t.dataset.f) { t.dataset.f = '1'; t.src = 'https://drive.google.com/thumbnail?id=' + t.dataset.id + '&sz=w' + t.dataset.w; }
  }, true);
  function toast(msg) {
    var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 2200);
  }

  // 품목 뱃지 색 — 전산 화면(탬퍼몽키 인기/비인기)과 같은 색
  var BADGE_PALETTE = ['#2563eb','#db2777','#16a34a','#ea580c','#7c3aed','#0891b2','#b45309','#6b4f3a','#c026d3','#334155','#65a30d','#dc2626','#0f766e','#9333ea','#64748b','#a16207'];
  var BADGE_FIXED = { '팬츠':0,'반바지':1,'맨투맨':2,'후드':3,'집업후드':4,'긴팔':5,'반팔':6,'자켓':7,'점퍼':8,'니트':9,'가디건':10,'양말':11,'베스트':12,'긴팔셔츠':13,'반팔셔츠':14,'패딩':15 };
  function badgeColor(nm) {
    var i = BADGE_FIXED[nm];
    if (i === undefined) { var h = 0; String(nm || '').split('').forEach(function (ch) { h = (h * 31 + ch.charCodeAt(0)) >>> 0; }); i = h % BADGE_PALETTE.length; }
    return BADGE_PALETTE[i];
  }
  function badge(nm) { return nm ? '<span class="bd" style="--c:' + badgeColor(nm) + '">' + esc(nm) + '</span>' : ''; }
  function nameLine(p, withNew) { return '<span class="nl">' + badge(p.it) + '<b>' + esc(name(p)) + '</b>' + (withNew && isNew(p) ? '<span class="nw">NEW</span>' : '') + '</span>'; }

  function today0() { var d = new Date(); d.setHours(0,0,0,0); return d; }
  function isNew(p) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(p.seen)) return false;
    var a = p.seen.split('-'), d = new Date(+a[0], +a[1]-1, +a[2]);
    return (today0() - d) / 86400000 < NEW_DAYS;
  }
  // 신상품 순서: 매장 입고 순번(큰 것 = 최근) → 그다음 기존 상품은 품번 시즌 순
  function newOrder(a, b) { return (b.seq || 0) - (a.seq || 0) || skey(b.c) - skey(a.c) || (a.c < b.c ? -1 : 1); }
  function match(p) {
    if (st.cat !== '전체' && group(p) !== st.cat) return false;
    if (st.sub && p.it !== st.sub) return false;
    if (st.q) { var q = st.q.toLowerCase(); return (name(p) + ' ' + p.c + ' ' + p.it).toLowerCase().indexOf(q) >= 0; }
    return true;
  }
  function card(p, opt) {
    opt = opt || {};
    return '<button class="card" data-p="' + esc(p.c) + '"><div class="ph">' + imgTag(p.img, 400, name(p)) + (opt.isNew && isNew(p) ? '<span class="nw">NEW</span>' : '') + '</div>' + nameLine(p) + '</button>';
  }
  function secHead(no, en, title, right) {
    return '<div class="sec"><div><div class="lab"><em>' + no + '</em>' + en + '</div><h2>' + title + '</h2></div>' + (right || '') + '</div>';
  }
  function empty(msg) { return '<div class="empty"><img src="assets/bear-line.png" alt="">' + msg + '</div>'; }

  // ---------- 메인 ----------
  function renderHome() {
    var app = document.getElementById('app');
    if (!document.getElementById('content')) {
      app.innerHTML =
        '<div class="topwrap hcard"><header class="top"><div class="trow"><a class="brand hb" href="#/" aria-label="더블제이디 현대백화점 천호점"><span class="av"><img src="assets/store-sign.jpg" alt=""></span><span class="bt"><img src="assets/logo-white.png" alt="DOUBLEJD"><span>현대백화점 천호점 B1</span></span></a>' +
        '<button class="inst" id="inst" hidden>' + ICON_DL + '앱으로 설치</button></div>' +
        '<div class="acts"><a class="pill sm" href="tel:' + STORE.tel.replace(/-/g, '') + '">' + ICON_TEL + '전화</a><a class="pill sm" href="' + smsLink('[더블제이디 천호점 문의]\n') + '">' + ICON_SMS + '문자</a>' +
        '<a class="pill sm" href="#/visit">오시는 길</a><a class="pill sm dark" href="#/fit">코디해보기</a></div></header></div>' +
        '<div id="hometop"></div>' +
        '<div class="box"><div class="search" style="padding-top:18px"><input id="q" type="search" aria-label="상품 검색" placeholder="후드집업, 와이드 데님…" autocomplete="off"></div>' +
        '<div class="chips hs" id="cats"></div><div class="chips sub hs" id="subs"></div><div id="content"></div></div><div id="content2"></div>';
      var q = document.getElementById('q');
      q.value = st.q;
      q.addEventListener('input', function () { st.q = q.value.trim(); st.more = false; renderContent(); });
    }
    renderTop(); renderFilters(); renderContent(); instInit();
  }
  function renderFilters() {
    document.getElementById('cats').innerHTML = CATS.map(function (c) { return '<button class="pill' + (c === st.cat ? ' on' : '') + '" data-cat="' + c + '">' + c + '</button>'; }).join('');
    var subs = document.getElementById('subs');
    if (st.cat === '전체') { subs.innerHTML = ''; subs.style.display = 'none'; return; }
    var cnt = {};
    D.items.forEach(function (p) { if (group(p) === st.cat && p.it) cnt[p.it] = (cnt[p.it] || 0) + 1; });
    var names = Object.keys(cnt).sort(function (a, b) { return cnt[b] - cnt[a]; });
    subs.style.display = names.length > 1 ? '' : 'none';
    subs.innerHTML = '<button class="sb' + (!st.sub ? ' on' : '') + '" data-sub="">' + st.cat + ' 전체</button>' +
      names.map(function (n) { return '<button class="sb' + (st.sub === n ? ' on' : '') + '" data-sub="' + esc(n) + '" style="--c:' + badgeColor(n) + '"><i></i>' + esc(n) + '</button>'; }).join('');
  }
  // 맨 위: 현대백화점 천호점 행사 안내 → 신상품 → 천호점 추천 코디 (검색·필터와 상관없이 전체 기준)
  function homeSets(reshuffle) {
    if (!D.homeAll) {
      var seen = {}, pairs = [];
      (D.sets || []).forEach(function (x) { if (byCode[x.top] && byCode[x.bot]) { seen[x.top + '+' + x.bot] = 1; pairs.push([x.top, x.bot]); } });
      D.items.filter(isTop).forEach(function (t) { recs(t, isBot, 3).forEach(function (b) { var k = t.c + '+' + b.c; if (!seen[k] && t.img && b.img) { seen[k] = 1; pairs.push([t.c, b.c]); } }); });
      D.homeAll = pairs;

    if ((d.opt || d.pk || d.delph !== undefined || d.main || d.addsz) && A.sync) A.sync();
    if (d.main) { A.form.main = d.main; A.askMain = ''; renderEdit(); return; }
    if (d.addsz) { A.form.sizes.push(d.addsz); A.form.sizes.sort(function (a, b) { return SIZES.indexOf(a) - SIZES.indexOf(b); }); renderEdit(); return; }
    if (d.opt) { var f = A.form; f[d.opt] = f[d.opt] === d.v ? '' : d.v; var el = document.getElementById('f_' + d.opt); if (el) el.value = f[d.opt]; renderEdit(); return; }
    if (d.pk) { var lk = A.form.link, i = lk.indexOf(d.pk); if (i >= 0) lk.splice(i, 1); else { lk.push(d.pk); A.pq = ''; } renderEdit(); return; }
    if (d.delph !== undefined) { var gone = A.form.ph.splice(+d.delph, 1)[0]; if (gone === A.form.main) A.form.main = ''; renderEdit(); return; }
  });
  window.addEventListener('hashchange', route);

  // 작은 사진에 마우스를 대면 크게 보기 (마우스가 있는 PC에서만)
  (function () {
    if (!window.matchMedia || !matchMedia('(hover: hover) and (pointer: fine)').matches) return;
    var SMALL = '.rr .th img, .row2 .th img, .phs img, .recs img, .sv img, .mini .ph img';   // 추천 고르기(.pick)는 사진이 커서 제외
    var z = null;
    function hide() { if (z) { z.remove(); z = null; } }
    function place(e) {
      if (!z) return;
      var w = 300, h = 400, x = e.clientX + 18, y = e.clientY - h / 2;
      if (x + w > innerWidth - 8) x = e.clientX - w - 18;
      y = Math.max(8, Math.min(innerHeight - h - 8, y));
      z.style.left = x + 'px'; z.style.top = y + 'px';
    }
    document.addEventListener('mouseover', function (e) {
      var t = e.target;
      if (!(t.tagName === 'IMG' && t.matches(SMALL) && t.dataset.id)) return;
      hide();
      z = document.createElement('div'); z.className = 'zoom';
      z.innerHTML = '<img alt="" src="' + img(t.dataset.id, 800) + '">';
      document.body.appendChild(z); place(e);
    });
    document.addEventListener('mousemove', place);
    document.addEventListener('mouseout', function (e) { if (e.target.tagName === 'IMG') hide(); });
    document.addEventListener('click', hide, true);
    window.addEventListener('hashchange', hide);
  })();

  // ---------- 앱으로 설치 / 즐겨찾기 ----------
  var instEvt = null;
  var UA = navigator.userAgent || '';
  var IS_IOS = /iPhone|iPad|iPod/.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var IS_INAPP = /KAKAOTALK|NAVER|Instagram|FBAN|FBAV|Line\//i.test(UA);
  var IS_MOBILE = IS_IOS || /Android/i.test(UA);
  function standalone() { return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true; }
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); instEvt = e; instInit(); });
  window.addEventListener('appinstalled', function () { instEvt = null; instInit(); toast('홈 화면에 추가했어요'); });
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});
  function instInit() {
    var b = document.getElementById('inst'); if (!b) return;
    if (standalone()) { b.hidden = true; return; }
    b.hidden = false;
    b.lastChild.textContent = IS_MOBILE ? '앱으로 설치' : '즐겨찾기';
    b.onclick = function () {
      if (instEvt) { instEvt.prompt(); instEvt.userChoice.then(function () { instEvt = null; }); return; }
      var t, m;
      if (IS_INAPP) { t = '브라우저에서 열어 주세요'; m = '지금 앱 안의 브라우저로 보고 있어요.<br>오른쪽 위(또는 아래) <strong>⋮ / 공유 메뉴 → 다른 브라우저로 열기</strong>를 누른 뒤 다시 설치해 주세요.'; }
      else if (IS_IOS) { t = '홈 화면에 추가하기'; m = '사파리 아래쪽 <strong>공유 버튼(□↑)</strong>을 누르고<br><strong>홈 화면에 추가</strong>를 고르면 앱처럼 열 수 있어요.'; }
      else if (IS_MOBILE) { t = '홈 화면에 추가하기'; m = '브라우저 오른쪽 위 <strong>⋮ 메뉴 → 홈 화면에 추가</strong>(또는 앱 설치)를 눌러 주세요.'; }
      else { t = '즐겨찾기에 추가하기'; m = '<strong>' + (/Mac/.test(navigator.platform) ? '⌘ + D' : 'Ctrl + D') + '</strong>를 누르면 즐겨찾기에 추가돼요.<br>크롬·엣지는 주소창 오른쪽의 <strong>설치 아이콘</strong>으로 앱처럼 설치할 수도 있어요.'; }
      var g = document.createElement('div'); g.className = 'guide';
      g.innerHTML = '<div role="dialog" aria-modal="true"><b>' + t + '</b><p>' + m + '</p><button class="pill dark" style="min-height:46px">확인</button></div>';
      g.addEventListener('click', function (e) { if (e.target === g || e.target.tagName === 'BUTTON') g.remove(); });
      document.body.appendChild(g);
    };
  }

  // 옆으로 넘기는 줄: 더 넘길 내용이 있는 쪽 가장자리를 흐리게
  function edge(el) {
    var l = el.scrollLeft > 2, r = el.scrollLeft + el.clientWidth < el.scrollWidth - 2;
    el.classList.toggle('fl', l); el.classList.toggle('fr', r);
  }
  function edgesAll() { Array.prototype.forEach.call(document.querySelectorAll('.hs'), edge); }
  document.addEventListener('scroll', function (e) { var t = e.target; if (t && t.classList && t.classList.contains('hs')) edge(t); }, true);
  window.addEventListener('resize', edgesAll);
  var edgeQ = 0;
  new MutationObserver(function () { if (!edgeQ) edgeQ = requestAnimationFrame(function () { edgeQ = 0; edgesAll(); }); }).observe(document.body, { childList: true, subtree: true });

  // ---------- 불러오기 ----------
  function prep(data) {
    data.items = (data.items || []).filter(function (p) { return /^J[A-Z]{3}\d{2}[0-9A-Z]\d{2}$/.test(p.c); });
    byCode = {};
    data.items.forEach(function (p) { byCode[p.c] = p; });
    return data;
  }
  function start(data) { D = prep(data); renderHome(); route(); }
  // 새 자료가 오면 보고 있는 화면은 그대로 두고 목록만 바꿈
  function refresh(data) {
    if (!D) return start(data);
    if (data.at === D.at && data.items.length === D.items.length) return;
    D = prep(data);
    if (document.getElementById('content')) { renderFilters(); renderContent(); }
  }
  function fail(msg) { if (D) return; document.getElementById('app').innerHTML = '<header class="top"><a class="brand" href="#/"><img src="assets/logo-white.png" alt="DOUBLEJD"><span>현대백화점 천호점</span></a></header>' + empty(msg); }
  if ((location.hash || '').indexOf('#/admin') === 0) route();
  // 열 때마다 시트에서 최신 자료를 받아 옴 (그동안 '불러오는 중' 화면)
  fetch(API + (API.indexOf('?') >= 0 ? '&' : '?') + 'hp=1', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (d) { if (!d || !d.ok) throw new Error(); start(d); loadEvents(); })
    .catch(function () { fail('상품을 불러오지 못했어요. 잠시 뒤 다시 열어 주세요.'); });
})();
</script>
